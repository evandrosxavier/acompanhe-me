version: '3.8'
services:

  db-notificacoes:
    image: postgres:16
    container_name: agende-me-notificacoes-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=agendeme_notificacoes_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - pgdata_notificacoes:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: acompanheme-mailpit
    ports:
      - "1025:1025"   # SMTP: onde a aplicação entrega os e-mails
      - "8025:8025"   # Web: onde você vê os e-mails no navegador

volumes:
  pgdata_notificacoes: