services:
  db-postgres:
    image: postgres:16
    container_name: acompanhemesolicitacoes-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=solicitacoes_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - pgdata:/var/lib/postgresql/data

  # O Kafka e o Zookeeper são compartilhados: sobem pelo docker-compose.yml da raiz do monorepo.

volumes:
  pgdata:
